name: Contracts CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and Test Contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'contracts/**/*.rs', 'contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all --check

      # creditline-contract embeds the four dependency WASMs via
      # soroban_sdk::contractimport!, so those WASMs must exist before
      # creditline compiles. Build them individually first.
      - name: Build dependency WASMs first
        run: |
          cargo build --locked --target wasm32-unknown-unknown --release \
            -p liquidity-pool-contract
          cargo build --locked --target wasm32-unknown-unknown --release \
            -p vendor-registry-contract
          cargo build --locked --target wasm32-unknown-unknown --release \
            -p reputation-contract
          cargo build --locked --target wasm32-unknown-unknown --release \
            -p parameters-contract
          cargo build --locked --target wasm32-unknown-unknown --release \
            -p vouching-contract

      # Lint after the dependency WASMs exist so creditline-contract's
      # contractimport! clients resolve during the native clippy compile.
      - name: Clippy (lint gate)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build all contracts
        run: |
          cargo build --locked --target wasm32-unknown-unknown --release

      - name: Run tests
        run: |
          cargo test --locked 2>&1

      - name: Generate code coverage report
        env:
          CARGO_LLVM_COV_FORMAT: lcov
        run: |
          cargo llvm-cov --workspace --locked --${CARGO_LLVM_COV_FORMAT} --output-path lcov.info --summary-only

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage
          path: lcov.info
          retention-days: 14
          if-no-files-found: error
